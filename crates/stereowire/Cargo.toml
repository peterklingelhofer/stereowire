[package]
name = "stereowire"
version.workspace = true
edition.workspace = true

[[bin]]
name = "stereowire"
path = "src/main.rs"

[dependencies]
stereowire-proto = { path = "../stereowire-proto" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-video-toolbox = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-quartz-core = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
objc2-core-audio-types = "0.3"

# 0.62 matches the copy cpal already pulls in for its WASAPI backend, so this
# unifies rather than adding a second copy of the crate to Cargo.lock.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Performance",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }
